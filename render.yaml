# Render Blueprint — https://render.com/docs/blueprint-spec
# "New +" -> "Blueprint" on Render, point it at this repo, and it reads this
# file to set up the service. Secrets (sync: false) aren't stored here —
# Render prompts for each one during setup; get the real values from
# .env.production (never commit that file).
services:
  - type: web
    name: businessos-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: SUPABASE_PROJECT_ID
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: BILLING_ENABLED
        value: "true"
      - key: PAYNOW_INTEGRATION_ID
        sync: false
      - key: PAYNOW_INTEGRATION_KEY
        sync: false
      # Platform host. Public shops use https://{slug}.{this host}.
      # Add a wildcard DNS record for *.yourdomain on the Render service.
      # The build copies this into the browser bundle.
      - key: APP_URL
        sync: false
      - key: PLATFORM_ADMIN_USER_ID
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: VITE_SENTRY_DSN
      - key: VITE_SENTRY_DSN_BACKEND
        sync: false
