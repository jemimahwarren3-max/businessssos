name: Flush mail outbox

# Claims pending Resend deliveries on the deployed app. Staging URL until
# production is explicitly cut over. Does nothing useful until
# RESEND_API_KEY, NOTIFY_FROM_EMAIL, and MAIL_FLUSH_SECRET are set.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  flush:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/internal/flush-mail
        env:
          APP_URL: ${{ secrets.STAGING_APP_URL }}
          MAIL_FLUSH_SECRET: ${{ secrets.MAIL_FLUSH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${MAIL_FLUSH_SECRET:-}" ]; then
            echo "Set GitHub secrets STAGING_APP_URL and MAIL_FLUSH_SECRET."
            exit 1
          fi
          curl -fsS -X POST "${APP_URL%/}/api/internal/flush-mail" \
            -H "Authorization: Bearer ${MAIL_FLUSH_SECRET}" \
            -H "Content-Type: application/json"
