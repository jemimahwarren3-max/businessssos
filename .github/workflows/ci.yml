name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Test
        run: npm run test
        env:
          # tests/integration/helpers.ts hardcodes the staging project ref
          # itself (so tests can never accidentally run against production)
          # and talks to it purely over the Management API — the only
          # credential any test actually reads is this one.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build
        run: npm run build
        env:
          APP_URL: http://localhost:8080
          SHOP_HOSTS: "false"
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}

  deploy:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/deploy-cloud-run.yml
    secrets: inherit
    with:
      region: europe-west1
      service: kwetuu
