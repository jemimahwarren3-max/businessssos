name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Per-ref so a PR cannot cancel master. Never cancel master/main deploys.
# Staging SQL is CREATE OR REPLACE / IF NOT EXISTS (last-writer-wins).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Apply staging SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_ID: slajanbsfqjnuuiohbmg
          REQUIRE_STAGING_SQL: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
          # Optional: when set, CI also wires GoTrue SMTP (signup/reset mail to any address).
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM_EMAIL: ${{ secrets.NOTIFY_FROM_EMAIL }}
        run: node scripts/apply-staging-sql.mjs

      - name: Staging readiness
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REQUIRE_STAGING_SQL: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            if [ "$REQUIRE_STAGING_SQL" = "true" ]; then
              echo "SUPABASE_ACCESS_TOKEN is required on master/main, refusing to skip staging readiness."
              exit 1
            fi
            echo "No SUPABASE_ACCESS_TOKEN, skipping staging readiness."
            exit 0
          fi
          node scripts/staging-readiness-check.mjs

      - name: Test
        run: npm run test
        env:
          # tests/integration/helpers.ts hardcodes the staging project ref
          # itself (so tests can never accidentally run against production)
          # and talks to it purely over the Management API, the only
          # credential any test actually reads is this one.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build
        run: npm run build
        env:
          APP_URL: http://localhost:8080
          SHOP_HOSTS: "true"
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}
  e2e-smoke:
    needs: check
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - run: npm ci

      - name: Build production preview
        run: npm run build
        env:
          APP_URL: http://127.0.0.1:8080
          SHOP_HOSTS: "true"
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Smoke tests (local preview)
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx playwright test --config e2e/playwright.config.ts --project=smoke

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-cloud-run.yml
    secrets: inherit
    with:
      region: europe-west1
      service: kwetuu
