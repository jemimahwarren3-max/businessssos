name: Generate due recurring invoices

# Runs the generator once a day against production. No user is driving this,
# so it can't go through the app's own auth — it calls
# generate_due_recurring_invoices() directly via PostgREST using the service
# role key (granted execute on that function alone; nothing else this key
# can reach is exposed beyond what it can already do). See
# supabase/migrations/20260828050000_recurring_invoices.sql.

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Call generate_due_recurring_invoices
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.PRODUCTION_SUPABASE_URL }}" ] || [ -z "${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "Set repository secrets PRODUCTION_SUPABASE_URL and PRODUCTION_SUPABASE_SERVICE_ROLE_KEY (businessos service_role, not anon)."
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "${{ secrets.PRODUCTION_SUPABASE_URL }}/rest/v1/rpc/generate_due_recurring_invoices" \
            -H "apikey: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "Generated $body recurring invoice(s)."
          if [ "$status" -ge 300 ]; then
            echo "::error::generate_due_recurring_invoices failed with HTTP $status: $body"
            exit 1
          fi
