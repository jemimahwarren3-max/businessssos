# Build Capacitor merchant Android: debug APK (sideload) + release AAB (Google Play when signed).
# See docs/GOOGLE_PLAY_MERCHANT_SUBMISSION.md and docs/DESKTOP_AND_MOBILE.md.
name: Android merchant APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName for Play (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "versionCode integer (must increase every Play upload)"
        required: true
        default: "1"
  push:
    tags:
      - "merchant-android-*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/merchant-android-}"
            echo "name=${TAG}" >> "$GITHUB_OUTPUT"
            echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write android/version.properties
        run: node scripts/android-set-version.mjs "${{ steps.ver.outputs.name }}" "${{ steps.ver.outputs.code }}"

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kwetuu-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/kwetuu-release.jks" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets for Capacitor
        env:
          APP_URL: https://mykwetuu.com
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder
        run: npm run build

      - name: Sync Capacitor Android
        env:
          CAPACITOR_SERVER_URL: https://mykwetuu.com/staff-login
        run: npx cap sync android

      - name: Assemble debug APK (sideload)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Bundle release AAB (Google Play)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwetuu-merchant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Upload Play Store AAB artifact
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kwetuu-merchant-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Publish GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/merchant-android-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: false
          name: Kwetuu merchant Android ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Upload **app-release.aab** to Google Play Console (Production or internal testing).
            Debug APK is for sideload / MERCHANT_APK_URL on /download.
            versionName ${{ steps.ver.outputs.name }}, versionCode ${{ steps.ver.outputs.code }}.
