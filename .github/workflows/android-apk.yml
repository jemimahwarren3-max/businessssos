# Build the Capacitor merchant APK for sideload (before Google Play).
# Publish: create tag merchant-android-YYYY.MM.DD (or run workflow_dispatch),
# download the artifact, upload to GitHub Releases or your CDN, then set
# MERCHANT_APK_URL on Cloud Run (see docs/DESKTOP_AND_MOBILE.md).
name: Android merchant APK

on:
  workflow_dispatch:
  push:
    tags:
      - "merchant-android-*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets for Capacitor
        env:
          APP_URL: https://mykwetuu.com
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder
        run: npm run build

      - name: Sync Capacitor Android
        env:
          CAPACITOR_SERVER_URL: https://mykwetuu.com/staff-login
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwetuu-merchant-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Publish GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/merchant-android-')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Kwetuu merchant Android ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Sideload build for merchants before Google Play. Install from /download after MERCHANT_APK_URL is set on production.
            Debug-signed; allow unknown sources on Android when prompted.
