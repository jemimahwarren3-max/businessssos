name: Nightly production backup

# Supabase's free tier ships with zero automated backups (pitr_enabled:
# false, no scheduled snapshots) — confirmed live via the Management API
# against the production project. This is the free substitute: a logical
# dump (public + auth schemas — auth is included so restored rows keep the
# same user IDs business_members/etc. reference, not just the app's own
# tables) taken nightly, encrypted, and kept as a workflow artifact for 14
# days. See docs/disaster-recovery.md for how to actually restore from one.
#
# Use the Supabase session-pooler connection string. The direct database host
# can resolve to IPv6, which GitHub-hosted runners may not be able to reach.

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Dump production database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "Set repository secret SUPABASE_DB_URL to the production Supabase session-pooler connection string."
            exit 1
          fi
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public --schema=auth \
            --no-owner --no-privileges \
            --format=custom \
            --file=backup.dump

      - name: Encrypt backup
        env:
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${PASSPHRASE:-}" ]; then
            echo "Set repository secret BACKUP_ENCRYPTION_PASSPHRASE and keep a copy in your password manager."
            exit 1
          fi
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$PASSPHRASE" backup.dump
          rm backup.dump

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: production-backup-${{ github.run_id }}
          path: backup.dump.gpg
          retention-days: 14
          if-no-files-found: error
